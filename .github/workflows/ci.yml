name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests, conformance, schemas, and documentation
        working-directory: reference
        run: npm run check
      - name: The demonstration reproduces byte for byte
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        working-directory: reference
        run: |
          npm run demo
          npm run vectors
          git diff --exit-code -- ../conformance ../examples/demo-match/*.jgr ../examples/analysis/information-value.json
